name: Release

# Pushing a tag like v0.1.0 builds MineNest for Windows and Linux and publishes the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          v="${GITHUB_REF_NAME#v}"
          flags="-s -w -X github.com/OwenCosta/minenest/internal/nest.Version=$v"
          mkdir dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$flags" -o "dist/minenest-$os-$arch$ext" ./cmd/minenest
            if [ "$os" = windows ]; then
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$flags -H windowsgui" -o "dist/minenest-gui-$os-$arch.exe" ./cmd/minenest-gui
            fi
          done
          cp scripts/install.sh scripts/install.ps1 dist/
          cp internal/web/static/icon.svg dist/minenest.svg
          cp assets/minenest.ico assets/minenest.png dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "MineNest ${GITHUB_REF_NAME#v}" --generate-notes
