<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineNest</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="files.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="icon.svg" alt=""><span>MineNest</span></div>
    <button class="btn primary" id="new-server">New server</button>
    <div class="side-label">Servers</div>
    <nav id="server-list"></nav>
    <div class="side-foot">
      <div id="update-note"></div>
      <div id="mem-note"></div>
      <button class="link" id="open-account">Settings and account</button>
      <div class="ver" id="version"></div>
    </div>
  </aside>
  <main id="main">
    <div id="empty" class="empty hidden">
      <img src="icon.svg" alt="">
      <h1>No servers yet</h1>
      <p>Make one and you can be playing on it in a minute or two. Pick Paper for plugins, Fabric, NeoForge or Forge for mods, or a whole modpack.</p>
      <button class="btn primary big" id="empty-new">Make a server</button>
    </div>
    <div id="server" class="page hidden">
      <header class="srv-head">
        <div>
          <h1 id="srv-name"></h1>
          <div class="sub" id="srv-sub"></div>
        </div>
        <div class="head-actions">
          <span class="state" id="srv-state"></span>
          <button class="btn primary" id="btn-start">Start</button>
          <button class="btn" id="btn-restart">Restart</button>
          <button class="btn" id="btn-stop">Stop</button>
        </div>
      </header>
      <div class="tabs" id="tabs">
        <button data-tab="overview" class="on">Overview</button>
        <button data-tab="console">Console</button>
        <button data-tab="addons" id="tab-addons-btn">Mods</button>
        <button data-tab="players">Players</button>
        <button data-tab="settings">Settings</button>
        <button data-tab="world">World</button>
        <button data-tab="files">Files</button>
        <button data-tab="internet">Internet</button>
      </div>
      <section class="tab" id="tab-overview"></section>
      <section class="tab hidden" id="tab-console">
        <div id="console" class="console"></div>
        <form id="console-form" class="console-input">
          <input id="console-cmd" autocomplete="off" placeholder="Type a command and press Enter, like: say Hello">
          <button class="btn">Send</button>
        </form>
      </section>
      <section class="tab hidden" id="tab-addons"></section>
      <section class="tab hidden" id="tab-players"></section>
      <section class="tab hidden" id="tab-settings"></section>
      <section class="tab hidden" id="tab-world"></section>
      <section class="tab hidden" id="tab-files"></section>
      <section class="tab hidden" id="tab-internet"></section>
    </div>
    <div id="create" class="page hidden"></div>
    <div id="account" class="page hidden"></div>
  </main>
</div>
<div id="jobs"></div>
<div id="toasts"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
</body>
</html>
